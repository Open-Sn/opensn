name: clang-tidy

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  tidy:
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: build
        shell: bash
        run: |
          module load python3/3.12.3 opensn/clang/22
          mkdir build && cd build && cmake -DOPENSN_WITH_PYTHON_MODULE=ON .. && make -j && cd ..
      - name: clang-tidy
        shell: bash
        run: |
          module load python3/3.12.3 opensn/clang/22
          tools/developer/run-clang-tidy.sh -extra-arg-before=--gcc-toolchain=/opt/local/opensn/gcc/14.2.0/gcc-14.2.0 \
                                            -extra-arg=-I/opt/local/opensn/clang/22.1.0/mpich-5.0.1/include
  tidy-cuda:
    runs-on: [self-hosted, cuda]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: build
        shell: bash
        run: |
          module load cuda/13.3.1 python3/3.12.3 opensn/clang/22
          mkdir build
          cd build
          cmake -DOPENSN_WITH_CUDA=ON \
                -DCMAKE_CUDA_ARCHITECTURES=89 \
                -DCMAKE_CUDA_FLAGS=--allow-unsupported-compiler \
                -DOPENSN_WITH_PYTHON_MODULE=ON \
                ..
          make -j
          cd ..
      - name: clang-tidy
        shell: bash
        run: |
          module load cuda/13.3.1 python3/3.12.3 opensn/clang/22
          tools/developer/run-cuda-clang-tidy.sh \
            --cuda-path /opt/local/cuda-13.3.1 \
            --cuda-arch sm_89 \
            --clang-arg="-I/opt/local/opensn/clang/22.1.0/mpich-5.0.1/include" \
            --clang-arg="--gcc-toolchain=/opt/local/opensn/gcc/14.2.0/gcc-14.2.0"
